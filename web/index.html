<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afterword</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <section class="pane pane--source">
      <header class="pane__header">
        <h1 class="pane__title">Source text</h1>
      </header>
      <div class="transcript" id="transcript">
        <p class="transcript__status">Loading transcript…</p>
      </div>
    </section>

    <section class="pane pane--work">
      <header class="pane__header pane__header--action">
        <button type="button" class="run-button" id="run-button">Turn this meeting into work</button>
      </header>
      <div class="work" id="work"></div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
